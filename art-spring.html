<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>오늘은 봄날 · 날씨 시계</title>
    <link rel="preconnect" href="https://api.open-meteo.com" />
    <style>
      /* 송출 전용 페이지. 사이트 CSS를 끌어오지 않고 필요한 것만 둔다.
         현장 박스에서 불러올 파일이 적을수록 켜질 때 빨리 뜨고 실패할 여지도 준다. */
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1017;
      }
      body { cursor: none; }
      .stage { position: fixed; inset: 0; }
      #springCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      /* 엔진이 값을 써 넣는 자리. 화면에는 은은하게만 남긴다. */
      .readout {
        position: absolute;
        left: 4vw;
        bottom: 5vh;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: rgba(255, 255, 255, 0.82);
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
        pointer-events: none;
      }
      .readout .kicker { margin: 0 0 0.4em; font-size: 1.4vw; letter-spacing: 0.14em; opacity: 0.75; }
      .readout h1 { margin: 0 0 0.3em; font-size: 5vw; font-weight: 800; letter-spacing: -0.03em; }
      .readout .line { margin: 0; font-size: 1.5vw; line-height: 1.6; max-width: 42ch; opacity: 0.88; }

      .metrics {
        position: absolute;
        right: 4vw;
        bottom: 5vh;
        display: flex;
        gap: 2.4vw;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
        pointer-events: none;
      }
      .metrics div { display: grid; gap: 0.2em; text-align: right; }
      .metrics span { font-size: 1.2vw; opacity: 0.7; letter-spacing: 0.08em; }
      .metrics strong { font-size: 2.6vw; font-weight: 700; font-variant-numeric: tabular-nums; }

      /* 엔진이 참조하지만 송출에는 필요 없는 버튼은 숨긴다. */
      #refreshButton { display: none; }
    </style>
  </head>
  <body>
    <main class="stage">
      <canvas id="springCanvas"></canvas>

      <section class="readout" aria-live="polite">
        <p class="kicker" id="placeLabel">대구의 하늘을 읽는 중</p>
        <h1>오늘은 봄날</h1>
        <p class="line" id="weatherLine">대구의 오늘 날씨와 시간이 시침·초침·꽃잎의 궤도를 바꿉니다.</p>
      </section>

      <div class="metrics">
        <div><span>기온</span><strong id="tempValue">--</strong></div>
        <div><span>하늘</span><strong id="skyValue">--</strong></div>
        <div><span>바람</span><strong id="windValue">--</strong></div>
      </div>

      <button id="refreshButton" type="button" hidden>새로고침</button>
    </main>

    <script src="./spring.js?v=20260803-player"></script>
    <script src="./player-beat.js?v=20260803-player"></script>
  </body>
</html>
