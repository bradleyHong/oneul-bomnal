<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>봄날 미디어박스</title>
    <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      body.hide-cursor { cursor: none; }

      #stage { position: fixed; inset: 0; background: #000; }

      /* 두 겹을 번갈아 쓴다. 다음 작품을 뒤에서 미리 띄워두고
         다 뜬 뒤에 겹쳐 넘긴다. 전환 중에 빈 화면이 스치지 않는다. */
      .layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 1.2s ease;
        pointer-events: none;
      }
      .layer.is-active { opacity: 1; }
      .layer iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .layer img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* 운영시간 밖에는 완전히 검게 둔다. 로고조차 띄우지 않는다.
         청사 소등 후 화면만 빛나면 민원이 들어온다. */
      body.is-resting #stage { background: #000; }

      /* 진단 화면 — D를 눌러야 뜬다 */
      #diagnostics {
        position: fixed;
        left: 2vw;
        top: 2vh;
        width: min(420px, 46vw);
        max-height: 96vh;
        overflow: auto;
        padding: 22px 24px;
        border-radius: 14px;
        background: rgba(8, 10, 14, 0.92);
        color: #e8eaf0;
        font-size: 14px;
        line-height: 1.5;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        z-index: 10;
      }
      #diagnostics h2 { margin: 0 0 14px; font-size: 17px; letter-spacing: -0.01em; }
      #diagnostics h3 { margin: 18px 0 8px; font-size: 12px; letter-spacing: 0.1em; opacity: 0.6; }
      .drow { display: flex; justify-content: space-between; gap: 16px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
      .drow span { opacity: 0.62; }
      .drow b { font-weight: 600; text-align: right; }
      #diagnostics ul { margin: 0; padding: 0; list-style: none; }
      #diagnostics li { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.07); color: #ffb4a8; }
      #diagnostics time { display: inline-block; min-width: 68px; opacity: 0.55; font-variant-numeric: tabular-nums; }
      #diagnostics .ok { margin: 0; color: #8fe3b0; }
      #diagnostics .hint { margin: 16px 0 0; font-size: 12px; opacity: 0.5; }

      /* 스크립트가 아예 실행되지 않는 최악의 경우에도
         로비에 흰 화면 대신 검은 화면이 남게 한다. */
      noscript { display: block; height: 100%; background: #000; }
    </style>
  </head>
  <body>
    <main id="stage">
      <div class="layer" id="layerA"></div>
      <div class="layer" id="layerB"></div>
    </main>

    <aside id="diagnostics" hidden aria-label="재생 상태"></aside>

    <noscript></noscript>
    <script src="./player.js?v=20260803-1"></script>
  </body>
</html>
